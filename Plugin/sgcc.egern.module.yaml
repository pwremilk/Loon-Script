name: 网上国网
description: 电费余额/本月电量/近7日用量，App 3.2.3 原生协议直连(SM2/SM3/SM4+Turing)，无第三方中转。填好账号密码保存后生效；首次登录提示短信验证时，把6位验证码填入 SGCC_SMS 保存，整点自动完成登录
author: "Hermes (协议: hass-state-grid MIT / githubdulong SGCC.js)"
icon: https://is1-ssl.mzstatic.com/image/thumb/Purple116/v4/83/d8/8a/83d88a92-5a4d-7a2f-118c-80d795e7a9f6/AppIcon-0-0-1x_U007emarketing-0-5-0-0-sRGB-85-220.png/144x144.png
env_schema:
  SGCC_USERNAME:
    name: 手机号
    description: 登录网上国网 App 的手机号
    default_value: ""
  SGCC_PASSWORD:
    name: 密码
    description: App 登录密码（没设过先在 App 里设置一个）
    default_value: ""
  SGCC_SMS:
    name: 短信验证码
    description: 仅首次新设备验证时填 6 位验证码；登录成功后请清空
    default_value: ""
  SGCC_ACCOUNT:
    name: 户号
    description: 留空=第一个户号；填尾号如 4567；#2=第二个；all=全部通知
    default_value: ""
  SGCC_POLICY:
    name: 请求策略
    description: 国网接口务必直连，保持 DIRECT
    default_value: DIRECT
  SGCC_SHOW_RECENT:
    name: 显示近7日电量
    options:
      - "true"
      - "false"
    default_value: "true"
scriptings:
- schedule:
    name: 网上国网
    cron: "10 * * * *"
    script_url: https://raw.githubusercontent.com/pwremilk/Loon-Script/main/Scripts/sgcc.egern.js?v=1
    timeout: 90
